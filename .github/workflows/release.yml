name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: StagePilot-Windows
          path: dist/StagePilot-Setup-*.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem -LiteralPath dist -Filter 'StagePilot-Setup-*.exe').FullName
          gh release create $env:GITHUB_REF_NAME $installer --generate-notes --title "StagePilot $env:GITHUB_REF_NAME"
