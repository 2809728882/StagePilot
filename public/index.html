<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f18">
  <title>StagePilot</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="login-screen" class="login-screen" hidden>
    <form id="login-form" class="login-card">
      <span class="eyebrow">STAGEPILOT</span>
      <h2>连接电脑</h2>
      <p>请输入电脑端设置的连接密码</p>
      <label for="connection-password">连接密码</label>
      <input id="connection-password" type="password" minlength="6" maxlength="64" autocomplete="current-password" required>
      <button type="submit">连接</button>
      <small id="login-message" role="status"></small>
    </form>
  </div>
  <div class="app-shell">
    <header>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <div><span class="eyebrow">STAGEPILOT</span><h1>演示遥控器</h1></div>
      </div>
      <span id="connection" class="status"><i></i>连接中</span>
    </header>

    <main>
      <section class="output-card" aria-labelledby="now-playing">
        <div class="output-visual" aria-hidden="true">
          <span class="screen-glow"></span>
          <span class="screen-icon"></span>
        </div>
        <div class="output-copy">
          <span class="card-label">当前电脑画面</span>
          <strong id="now-playing">等待连接</strong>
          <small id="system-status">正在读取电脑状态</small>
        </div>
        <span class="live-dot" aria-hidden="true"></span>
      </section>

      <section>
        <div class="section-title"><div><span class="section-kicker">QUICK LAUNCH</span><h2>快捷程序</h2></div></div>
        <div id="programs" class="shortcut-grid"></div>
      </section>

      <section>
        <div class="section-title">
          <div><span class="section-kicker">OPEN WINDOWS</span><h2>已打开窗口</h2></div>
          <button id="refresh-windows" class="text-button">刷新</button>
        </div>
        <div id="windows" class="window-list"></div>
      </section>

      <section>
        <div class="section-title">
          <div><span class="section-kicker">VIDEO LIBRARY</span><h2>视频库</h2><small id="media-folder" class="folder-label"></small></div>
          <button id="refresh" class="text-button">刷新</button>
        </div>
        <div id="media" class="video-grid"></div>
      </section>

      <button id="exit-control" class="exit-control"><span>退出电脑端管控</span><i aria-hidden="true">↗</i></button>
    </main>

    <section class="control-dock" aria-label="视频播放控制">
      <button data-command="seek" data-seconds="-10" aria-label="后退十秒"><b>−10</b><small>秒</small></button>
      <button data-command="pause" aria-label="暂停"><span class="pause-icon" aria-hidden="true"></span></button>
      <button data-command="resume" class="play-control" aria-label="播放"><span class="play-icon" aria-hidden="true"></span></button>
      <button data-command="seek" data-seconds="10" aria-label="前进十秒"><b>+10</b><small>秒</small></button>
      <button id="blackout" class="blackout" aria-label="安全黑屏"><span class="blackout-icon" aria-hidden="true"></span></button>
    </section>
  </div>
  <div id="toast" role="status"></div>
  <script src="/password-crypto.js"></script>
  <script src="/app.js"></script>
</body>
</html>
