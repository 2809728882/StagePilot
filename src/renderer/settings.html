<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'">
  <title>StagePilot 连接设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main>
    <span class="eyebrow">STAGEPILOT</span>
    <h1>连接密码</h1>
    <p>设置后，手机扫码还需要输入该密码。修改密码会让已经连接的手机立即失效。</p>
    <form id="password-form">
      <label for="password">新密码</label>
      <input id="password" type="password" minlength="6" maxlength="64" autocomplete="new-password" required>
      <label for="confirm-password">确认密码</label>
      <input id="confirm-password" type="password" minlength="6" maxlength="64" autocomplete="new-password" required>
      <button type="submit">保存连接密码</button>
    </form>
    <div id="message" role="status"></div>
  </main>
  <script src="settings.js"></script>
</body>
</html>
